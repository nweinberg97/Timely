<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timely</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <div class="logo-area">
            <h1>Timely</h1>
        </div>
        <nav class="mode-navigation">
            <button id="btn-schedule-mode" class="nav-btn active">Scheduling Mode</button>
            <button id="btn-planning-mode" class="nav-btn">Planning Mode</button>
        </nav>
        <div class="global-actions"></div>
    </header>

    <main class="app-container">
        <div id="schedule-view-selector" class="sub-nav">
            <button class="sub-nav-btn active" data-view="daily">Daily View</button>
            <button class="sub-nav-btn" data-view="weekly">Weekly View</button>
            <button class="sub-nav-btn" data-view="monthly">Monthly View</button>
            <button class="sub-nav-btn" data-view="reminders">Reminders Board</button>
        </div>

        <div id="planning-view-selector" class="sub-nav hidden"></div>

        <div class="workspace-wrapper">
            <section id="workspace-main" class="workspace-pane">
                </section>

            <aside class="sidebar-pane">
                <div class="universal-inbox-container">
                    <div class="pane-header">
                        <h2>Universal Board</h2>
                        <button id="btn-add-universal" class="add-card-btn">+ Add</button>
                    </div>
                    <div id="universal-board" class="drop-zone universal-zone" data-zone-type="universal" data-zone-id="universal"></div>
                </div>

                <div id="trash-zone" class="trash-container">
                    <div class="trash-icon">🗑️</div>
                    <p>Drag here to delete</p>
                </div>
            </aside>
        </div>
    </main>

    <div id="card-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Edit Item</h3>
            <div class="form-group">
                <label for="modal-card-title">Title</label>
                <input type="text" id="modal-card-title">
            </div>
            <div class="form-group">
                <label for="modal-card-desc">Description</label>
                <textarea id="modal-card-desc" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Routine Settings</label>
                <div class="routine-options">
                    <label><input type="radio" name="routine-repeat" value="none" checked> None</label>
                    <label><input type="radio" name="routine-repeat" value="daily"> Daily</label>
                    <label><input type="radio" name="routine-repeat" value="weekly"> Weekly</label>
                    <label><input type="radio" name="routine-repeat" value="monthly"> Monthly</label>
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-modal-close" class="action-btn secondary">Cancel</button>
                <button id="btn-modal-save" class="action-btn primary">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
